<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>PoE Chat Overlay</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="locked">
  <div id="frame">
    <div id="toolbar">
      <span class="title">PoE Chat. Edit mode (Ctrl+Shift+L locks)</span>
      <button id="btn-settings">Settings</button>
      <button id="btn-lock">Lock</button>
      <button id="btn-quit" class="danger">Quit</button>
    </div>

    <form id="settings" hidden>
      <label class="wide">Twitch channels for their BTTV/FFZ/7TV emotes (comma separated)
        <input name="twitchChannels" placeholder="zizaran, quin69, ghazzy" />
      </label>
      <label class="wide">Client.txt path (blank = auto-detect)
        <input name="logPath" placeholder="C:\Program Files (x86)\Steam\steamapps\common\Path of Exile\logs\Client.txt" />
      </label>
      <label>Font size <input name="fontSize" type="number" min="9" max="40" /></label>
      <label>Fade after (sec, 0 = never) <input name="fadeSeconds" type="number" min="0" max="3600" /></label>
      <label>Background opacity <input name="backgroundOpacity" type="range" min="0" max="1" step="0.05" /></label>
      <label class="check"><input name="showTimestamps" type="checkbox" /> Timestamps</label>
      <label class="check"><input name="emoteOnly" type="checkbox" /> Only show messages with emotes</label>
      <label class="check"><input name="onlyWhenPoeFocused" type="checkbox" /> Hide when PoE isn't the active window</label>
      <label class="check"><input name="hoverReveal" type="checkbox" /> Hover to see PoE's chat underneath (for items)</label>
      <fieldset>
        <legend>Channels</legend>
        <label class="check"><input name="ch-global" type="checkbox" /> # Global</label>
        <label class="check"><input name="ch-trade" type="checkbox" /> $ Trade</label>
        <label class="check"><input name="ch-party" type="checkbox" /> % Party</label>
        <label class="check"><input name="ch-guild" type="checkbox" /> &amp; Guild</label>
        <label class="check"><input name="ch-whisper" type="checkbox" /> @ Whispers</label>
        <label class="check"><input name="ch-local" type="checkbox" /> Local</label>
        <label class="check"><input name="hideNpcs" type="checkbox" /> Hide NPC dialogue</label>
      </fieldset>
      <div class="row">
        <button type="submit">Save</button>
        <button type="button" id="btn-refresh">Reload emotes</button>
        <span id="emote-count"></span>
      </div>
    </form>

    <div id="chat"></div>
    <div id="status"></div>
    <div id="grip" title="Drag to resize"></div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
